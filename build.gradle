plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

loom {
    mixin { defaultRefmapName = 'nova-refmap.json' }
}

// Все файлы лежат в корне репозитория: собираем из них нормальную структуру
def flatLayout = !file('src/main/java').exists()
if (flatLayout) {
    def flatRes = layout.buildDirectory.dir('flatres').get().asFile
    def flatResources = tasks.register('flatResources', Sync) {
        from('.') { include 'fabric.mod.json', 'nova.mixins.json' }
        from('.') { include 'en_us.json', 'ru_ru.json'; into 'assets/nova/lang' }
        into flatRes
    }
    sourceSets {
        main {
            java { srcDirs = ['.']; include '*.java' }
            resources { srcDirs = [flatRes] }
        }
    }
    tasks.named('processResources') { dependsOn flatResources }
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn flatResources }
}
